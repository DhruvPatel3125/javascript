<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Inquiry</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<style>
    .container{
        max-width: 600px;
        margin-top: 50px;
        padding: 20px;
        border: 1px solid #aaa;
        box-shadow: 0px 0px 10px;
    }
</style>
<body>
    <div class="container">
        <div class="registration-form mt-5">
            <h3 class="text-center">Admission Inquiry</h3>
            <form id="inquiryForm" onsubmit="return func()">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" class="form-control" id="fullname">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" class="form-control" id="phone">
                </div>
                <div class="form-group">
                    <label for="course">Course Interested:</label>
                    <select class="form-control" id="course">
                        <option value="">Select Course</option>
                        <option value="computer-science">Computer Science</option>
                        <option value="business-administration">Business Administration</option>
                        <option value="mechanical-engineering">Mechanical Engineering</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Submit Inquiry</button>
            </form>
        </div>
    </div>
    <script>
        
    </script>
</body>
</html>
