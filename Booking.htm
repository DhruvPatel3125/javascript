<style>
   .package-card{
    box-shadow: 0px 0px 15px #aaa;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
   }
   .package-img{
    width: 100%;
    height: 200px;
    object-fit: cover;
   }
   .package-details{
    padding: 15px;
   }
   .price{
    font-size: 24px;
    font-weight: bold;
}
</style>
<body>
    <div class="container">
        <h2 class="text-center mt-5">Hotel booking package</h2>
        <div class="row mt-4">
            <div class="col-md-4">

                    <img src="/box3_image.jpg" class="package-img" alt="img">
                    <div class="package-details">
                        <h4>Super Deluxe Package</h4>
                        <p>Enjoy</p>

                    </div>
                </div>
            </div>
            <div class="col-md-4">
