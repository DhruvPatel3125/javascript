<!-- Booking hotel Registration of Customer (Registration required fields like Email, Password, Birth Date, Gender, Language, City and Mobile Number.) -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
    body {
        background-color: #fff;
    }

    .container {
        max-width: 500px;
        margin: 50px auto;
        padding: 30px;
        border: 1px solid #aaa;
        box-shadow: 0px 0px 15px;

    }
</style>

<body>
    <div class="container">
        <form action="Booking.htm" onsubmit="return func()">
            <h1>Hotel Registration</h1>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" name="email" id="email">
            </div>
            <div class="form-group">
                <label for="Password">Password:</label>
                <input type="password" class="form-control" name="password" id="password">
            </div>
            <div class="form-group">
                <label for="email">Birth Date:</label>
                <input type="date" class="form-control" name="dob" id="dob">
            </div>
            <div class="form-group">
                <label for="Gender">Gender:</label>
                <select name="gender" class="form-control" id="gender">
                    <option value="gender">--Select gender--</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="Language">Language:</label>
                <input type="language" class="form-control" name="language" id="language">
            </div>
            <div class="form-group">
                <label for="city">City:</label>
                <input type="city" class="form-control" name="city" id="city">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="number" class="form-control" name="number" id="number">
            </div>
            <button type="submit" class="btn btn-primary" style="padding: 10px; margin: 10px;">Submit</button>

        </form>
    </div>
    <script>
        function func() {
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let dob = document.getElementById("dob").value;
            let gender = document.getElementById("gender").value;
            let language = document.getElementById("language").value;
            let city = document.getElementById("city").value;
            let number = document.getElementById("number").value;

            if(email==""||password==""||dob==""||gender==""||language==""||city==""||number==""){
                alert("Please fill all the fields");
                return false;
            }
            else{
                alert("Form submitted successfully");
                return true;
            }
        }
    </script>
</body>

</html>
